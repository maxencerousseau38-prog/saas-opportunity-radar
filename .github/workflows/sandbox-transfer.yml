name: Apply verified Sandbox working tree

on:
  push:
    branches:
      - claude/loving-planck-hoazd4
    paths:
      - .github/workflows/sandbox-transfer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested branch
        uses: actions/checkout@v5
        with:
          ref: claude/loving-planck-hoazd4
          persist-credentials: true

      - name: Download and verify the isolated Sandbox archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://sb-73owey266qnr.vercel.run/ZPGt6x41KX-o4mibkgWRGzv3MmCKgU2MLoPjoAPQOI74_YVG' \
            --output /tmp/sor-changes.tar.gz
          echo '5956dde39850901a3eb1c6b6332cf42822c10f6fe23523e6ae35ab5c16df7687  /tmp/sor-changes.tar.gz' | sha256sum --check
          tar -tzf /tmp/sor-changes.tar.gz
          tar -xzf /tmp/sor-changes.tar.gz -C .

      - name: Commit verified files to the working branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md DESIGN.md AGENTS.md .agents/skills \
            apps/web/app/login/login-form.tsx apps/web/app/page.tsx \
            apps/web/app/signup/actions.ts apps/web/app/signup/signup-form.tsx \
            'apps/web/app/w/[workspaceId]/layout.tsx' apps/web/components/workspace/nav.tsx \
            apps/web/e2e/catalog.e2e.ts apps/web/test/security-headers.test.ts \
            packages/database/src/generated.ts scripts/benchmark-catalog.mjs
          git commit -m 'chore: restore CI checks and add project agent skills'
          git push origin HEAD:refs/heads/claude/loving-planck-hoazd4
